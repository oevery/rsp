id: ordinary-implementation
evidence:
  - the required behavior and correction are evidenced and testable
  - no user, Change, or project instruction requires test-first work
  - no concrete changed risk makes a pre-mutation RED materially safer
expected:
  next_action: continue ordinary rsp-implement work
  returned_owner: the same selected Change
sources:
  - skills/rsp/SKILL.md
  - skills/rsp-implement/SKILL.md
required_contract:
  - use `rsp-implement`
  - Ordinary implementation by default
  - mere testability or being a fix does not
  - Fresh verification is required, but a new test is only one evidence option
  - same Change
prohibited_actions: [unnecessary-diagnosis, unnecessary-tdd, recursive-skill-invocation, commit, push, publish]
