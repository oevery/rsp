id: same-shape-assignment-batching
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/managed-exchange.md
  - .rsp/specs/skill-control-model.md
evidence:
  - Repeated small edits inside one WorkRef should not mechanically require one worker per file when they share every control boundary.
  - Compatible Group children may reuse one primary WorkerSession without merging WorkRef identity or acceptance.
  - Batching must fail closed when writer, verification, review, replay, authority, or resource boundaries differ.
required_contract:
  - Batch small same-shape edits only when role, seam, writer, authority, replay, verification, review, and ResourceLease boundaries match
  - Never batch distinct WorkRefs into one Assignment or WorkerReceipt
  - Compatible Group children may reuse a primary WorkerSession, but each child retains its own Assignment, WorkerInvocation, and WorkerReceipt
  - Every fresh WorkerSession receives one complete `Assignment`
prohibited_actions:
  - one worker per file by default
  - batch distinct WorkRefs
  - merge Group child Receipts
  - batch incompatible writer boundaries
  - batch incompatible review surfaces
  - token cost overrides authority
