id: frontier-precedence-stop
sources:
  - skills/rsp-manage/SKILL.md
evidence:
  - A qualified ready owner classifies newly surfaced uncertainty in fail-closed precedence order.
  - Owner decisions, fog, and out-of-goal evidence stop before evidence or Fix dispatch.
required_contract:
  - '`out-of-goal` → `owner-decision` → `fog` → `evidence-needed` → `ready-to-execute`'
  - '`out-of-goal`: return topology or authority resolution to Core; stop `reroute`.'
  - '`owner-decision`: ask the `DecisionOwner` one highest-impact question'
  - This is not yet a precise question
  - Create no synthetic Task, Change, Blocker, worker dispatch, or product mutation
  - If it crosses an earlier boundary, use that boundary's stop instead of selecting Fix
prohibited_actions:
  - evidence lane before owner-decision
  - synthetic work for fog
  - Fix outside the selected goal
