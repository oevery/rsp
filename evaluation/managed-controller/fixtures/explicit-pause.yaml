id: explicit-pause
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/interruption-recovery.md
evidence:
  - The user explicitly pauses a managed run while a worker may still be active.
required_contract:
  - interrupt active workers and confirm they have stopped before acknowledging the pause
  - Keep the focused WorkRef selected
  - do not mutate again until resume
prohibited_actions:
  - acknowledge before interruption
  - unfocus on pause
