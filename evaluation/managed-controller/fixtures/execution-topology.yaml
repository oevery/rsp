id: execution-topology
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp/references/managed-routing.md
  - skills/rsp/references/control-outcome.md
  - skills/rsp-manage/references/managed-exchange.md
evidence:
  - Worker reuse is a continuity optimization, while fresh workers establish independence or a reasoning reset.
  - Execution location is observed from the host and remains separate from worker dispatch.
required_contract:
  - ExecutionFrame
  - WorkerSession
  - WorkerInvocation
  - Assignment
  - AssignmentDelta
  - WorkerReceipt
  - AcceptedLaneEvidence
  - ResourceLease
  - 'mode: solo | delegated | coordinated'
  - Report `solo` with no worker, including bounded local Discipline execution
  - '`delegated` with one compatible primary WorkerSession'
  - '`coordinated` with multiple workers or an independence-seeking worker obligation'
  - control-action
  - longitudinal
  - sequential
  - parallel-wave
  - read-only-fan-out
  - bounded-correction
  - independent-verify
  - Prefer the same primary WorkerSession
  - requires a fresh WorkerSession
  - immediately accepted Assignment or AssignmentDelta in that same observed WorkerSession
  - Session loss
  - complete Assignment
  - otherwise equally safe and authorized strategies
  - a worker identity never proves filesystem or runtime isolation
  - Use only the execution location actually provided by the host
prohibited_actions:
  - persisted topology
  - worker identity as isolation proof
  - universal primary worker
  - inherit AssignmentDelta across WorkerSessions
