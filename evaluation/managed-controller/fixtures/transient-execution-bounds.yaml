id: transient-execution-bounds
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/managed-exchange.md
  - skills/rsp-manage/references/review-convergence.md
  - skills/rsp/references/managed-routing.md
evidence:
  - Same-scope receipts require changed-path and local-diff inspection before later mutation.
  - Dispatch is bounded by necessary Assignments rather than one whole-run quota.
  - Correction is Assignment-scoped and independent Verify remains a separate obligation.
  - Controller execution state remains response-only and is never durable project state.
required_contract:
  - Manager matches the echoed Assignment identity to the current WorkerInvocation
  - unchanged same-scope work never returns to Core merely to repeat qualification
  - Do not impose one fixed dispatch ceiling across the whole managed run
  - Every dispatch requires one necessary bounded Assignment
  - at most three correction passes by default
  - stops earlier when the same failure repeats without new evidence
  - Independent Verify is a separate required acceptance obligation
  - does not consume the Fix correction allowance
  - Allow at most three Resolve Findings passes per Change, separate from the worker retry limit
  - Keep transient control, execution, receipt, resource, topology, and chronology data response-only
  - Create no frontier file, ticket map, ledger, registry, graph, hook, numeric routing score, run directory, or receipt/worker/verification registry
  - Never persist the goal envelope, ExecutionFrame, DispatchDisposition
prohibited_actions:
  - fixed whole-run dispatch quota
  - unbounded correction
  - correction consuming independent Verify identity
  - fixed per-lane allocations
  - more than three managed review passes
  - persisted controller state
