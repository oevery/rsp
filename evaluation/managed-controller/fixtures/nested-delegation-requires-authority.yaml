id: nested-delegation-requires-authority
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/managed-exchange.md
  - .rsp/specs/skill-control-model.md
evidence:
  - A worker-created helper or reviewer must not bypass the Assignment or duplicate Manager-owned acceptance obligations.
  - Explicitly authorized descendants remain owned by one parent WorkerSession and collapse into one WorkerReceipt.
required_contract:
  - A WorkerSession is a leaf by default
  - Nested delegation requires explicit Assignment authority
  - The parent owns descendant work, background processes, and ResourceLeases
  - returns one schema-valid WorkerReceipt
  - cannot satisfy Manager-owned independent Verify or fixed-scope Review
  - Descendant coordination remains transient
prohibited_actions:
  - implicit nested delegation
  - worker-created reviewer grants review-clean
  - descendant gains ambient authority
  - durable descendant registry
