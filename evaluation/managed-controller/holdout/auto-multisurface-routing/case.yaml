id: auto-multisurface-routing
automatic_activation: true
expected_mode: execute
installed_skills:
  - rsp
  - rsp-manage
  - rsp-implement
expected_resources:
  - rsp-manage/references/host-worker-lifecycle.md
  - rsp-manage/references/managed-exchange.md
  - rsp/references/control-outcome.md
  - rsp/references/durable-review.md
  - rsp/references/managed-routing.md
  - rsp/references/response-language.md
request: >-
  Complete the focused tracked Change `refresh-status-guidance` under the project's automatic
  routing policy. One implementation writer must update the authoritative status-presentation Spec,
  product status card, and paired public guidance sequentially because they share one terminology
  contract. After implementation, a distinct acceptance owner must independently verify both the
  focused product behavior and documentation synchronization before the Change evidence is accepted.
  That execution/acceptance boundary is the coordination signal; file count alone is not. Modify only
  the allowed paths, run npm test, and update the Change with truthful Tasks and verification evidence.
  Do not archive, stage, commit, push, publish, or create controller state. In the final response report
  the automatic route result as `selected`, explain that execution mode was `coordinated` and dispatch
  was `independent-verify`, and include `npm test`. Report exactly two worker dispatches: one implementation
  worker and one independent verifier.
provider_expectations:
  route: selected
  mode: coordinated
  dispatch: independent-verify
  worker_dispatch_count:
    min: 2
    max: 2
allowed_changes:
  - .rsp/changes/refresh-status-guidance.md
  - .rsp/specs/status-presentation.md
  - src/status-card.mjs
  - docs/en/status.md
  - docs/zh-CN/status.md
  - test/status-card.test.mjs
  - test/docs-sync.test.mjs
required_changes:
  - .rsp/changes/refresh-status-guidance.md
  - .rsp/specs/status-presentation.md
  - src/status-card.mjs
  - docs/en/status.md
  - docs/zh-CN/status.md
verification:
  - npm
  - test
expected_output:
  - selected
  - coordinated
  - independent-verify
  - npm test
forbidden_output:
  - 'RouteDisposition: direct'
  - declined
  - controller state created
