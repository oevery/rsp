id: managed-delegated-integrated
base_case: auto-multisurface-routing
automatic_activation: true
expected_mode: execute
installed_skills:
  - rsp
  - rsp-manage
  - rsp-implement
request: >-
  Complete the focused tracked Change `refresh-status-guidance` under automatic routing. Lifecycle
  coordination makes Manage eligible, and implementation belongs to exactly one compatible primary
  worker. Delegate one complete assignment covering the coupled Spec, product card, paired guidance,
  tests, truthful Change update, and the single integrated `npm test` verification. Reuse that same
  WorkerSession through its receipt; do not create an independent verifier or a second implementation
  worker. Modify only the allowed paths. Do not archive, stage, commit, push, publish, or create controller
  state. Report `selected`, mode `delegated`, dispatch `sequential`, `one worker dispatch`, and `npm test`.
provider_expectations:
  route: selected
  mode: delegated
  dispatch: sequential
  worker_dispatch_count:
    min: 1
    max: 1
allowed_changes:
  - .rsp/changes/refresh-status-guidance.md
  - .rsp/specs/status-presentation.md
  - src/status-card.mjs
  - docs/en/status.md
  - docs/zh-CN/status.md
  - test/status-card.test.mjs
  - test/docs-sync.test.mjs
required_changes:
  - .rsp/changes/refresh-status-guidance.md
  - .rsp/specs/status-presentation.md
  - src/status-card.mjs
  - docs/en/status.md
  - docs/zh-CN/status.md
verification:
  - npm
  - test
expected_output:
  - selected
  - delegated
  - sequential
  - one worker dispatch
  - npm test
forbidden_output:
  - 'RouteDisposition: direct'
  - coordinated
  - independent verifier
  - controller state created
