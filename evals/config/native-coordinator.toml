# Native root-session overlay, NOT a profile accepted by the single-turn adapter.
# Compose with base.toml, coordinator.toml and a private provider-only config.
# Live use needs separate authority, worker attribution and invocation accounting.
[features]
multi_agent = true
multi_agent_v2 = false

[agents]
enabled = true
max_concurrent_threads_per_session = 2
max_depth = 1
default_subagent_model = "AI-HUB/gpt-6-sol"
default_subagent_reasoning_effort = "medium"
