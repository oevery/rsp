id: implement-interrupted-verification
kind: regression
skill: rsp-implement
# Recovery behavior permits a read-only Verify pass followed by owner writeback.
# Required implementation activation remains in trigger/ready-workflow cases.
activation: optional
prompt: 'Continue the interrupted requested-export Change. The code modification is already present; verify it and complete only the existing Change Tasks/Verify. Preserve the code, user notes and index. Do not create another Change, archive, commit or publish.'
oracle: project-outcome
fixture: fixture
tooling: rsp-cli
project_check: requested-export
hard:
  allowed_paths: [.rsp/changes/requested-export.md]
  forbidden_actions: [push, publish]
expected:
  mode: implemented
rubric:
  - name: task-correctness
    description: 'Recovers from recorded state, verifies existing output, and avoids repeating implementation or creating a second owner.'
  - name: scope-and-evidence
    description: Preserve user work and report only actual observations and verification.
