id: trigger-rsp-design
kind: trigger
skill: rsp-design
prompt: 'Use rsp-design for a report-only pre-Change design: should a small CLI store configuration in a single versioned file or separate per-command files? State one recommendation, its assumptions and tradeoffs. Do not create a Change or implement anything.'
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
  required_skill_read: true
rubric:
  - name: task-and-routing
    description: Answers the bounded configuration ownership question and distinguishes assumptions from inspected project facts.
  - name: authority-and-evidence
    description: No mutation, unrequested dispatch, Git delivery, fabricated evidence or unsupported completion claim.
