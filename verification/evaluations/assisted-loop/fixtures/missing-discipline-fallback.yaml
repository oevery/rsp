id: missing-discipline-fallback
stage: implementation
evidence:
  - diagnosis or test-first work is selected by evidence
  - the matching optional capability is absent
expected:
  next_action: use the corresponding manual diagnosis or TDD fallback
  returned_owner: the same selected Change
sources:
  - skills/rsp/SKILL.md
  - skills/rsp/references/implementation-evidence.md
required_contract:
  - manual fallback reproduces
  - manual fallback observes the focused RED
  - A missing optional Discipline Skill does not invalidate RSP
  - use its bounded manual fallback against the same owner
  - This fallback never substitutes for a required managed worker or required independent Verify
prohibited_actions: [commit, push, publish]
