id: material-negative-fact-control
goal: Preserve breaking-change, migration, and safety facts without requiring exact prose.
fixture: ../../workflows/managed-controller/holdout/release-material-negative-facts/base
automatic_activation: true
installed_skills: [rsp, rsp-manage, rsp-implement, rsp-release-docs]
request: >-
  Finalize RELEASE.md for the implemented Change remove-shell-command-mode and update its evidence.
  Explain that string shell commands are no longer accepted, show migration to executable plus
  argument arrays, and explain why this prevents shell command injection. Run npm test.
  Preserve the implemented API. Do not stage, commit, archive, push, tag, or publish.
allowed_changes: [RELEASE.md, .rsp/changes/remove-shell-command-mode.md]
verification: [node, __CASE_DIR__/check.mjs]
rubric:
  - RELEASE.md clearly identifies the breaking removal, a usable migration example, and the safety reason.
  - The handoff agrees with the actual change and verification; equivalent prose and formatting are acceptable.
