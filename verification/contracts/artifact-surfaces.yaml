version: 1
id: rsp-verification-artifact-surfaces
surfaces:
  - id: host-trace
    kind: trace
    required: true
    source: host_observed
    primary_dimension: compliance
  - id: workspace-artifacts
    kind: workspace
    required: false
    source: artifacts
    primary_dimension: artifact
  - id: route-decision
    kind: routing
    required: true
    source: host_observed.route
    primary_dimension: routing
  - id: worker-receipts
    kind: worker
    required: true
    source: worker_receipts
    primary_dimension: dispatch
  - id: final-handoff
    kind: handoff
    required: true
    source: final
    primary_dimension: handoff
