id: interrupted-continuation
stage: execution
evidence:
  - accepted mutations remain in the selected Change
  - another session must inspect drift before continuing
expected:
  returned_owner: the same selected Change and its existing authority pointers
  next_action: resume the smallest bounded action from fresh evidence
sources:
  - skills/rsp/SKILL.md
  - skills/rsp-manage/SKILL.md
  - skills/rsp-implement/SKILL.md
  - skills/rsp-diagnose/SKILL.md
  - skills/rsp-tdd/SKILL.md
  - skills/rsp-resolve-findings/SKILL.md
all_sources_contract:
  - WorkRef
  - Authority
  - Current state
  - Changed artifacts
  - Fresh verification
  - Blockers
  - Next action
language_contract:
  response_labels: follow the response language
  artifact_prose: follow the target artifact language
  canonical_tokens:
    - WorkRef
    - paths
    - commands
    - machine-consumed values
required_contract:
  - inspect worktree
  - not durable truth
  - explicit path authority
  - progress or status inquiry
  - explicit pause
  - release or unfocus
  - preserve the focused owner
  - requalify Manage
prohibited_actions: [hidden-state, stale-verification, second-state-store]
