id: blocker-continuation
skill_variant: product
evidence:
  - An environment or verification blocker stops dispatch while accepted work remains.
required_contract:
  - preserve the focused owner
  - 'WorkRef, Authority, Current state, Changed artifacts, Fresh verification, Blockers, and Next action'
  - durable blocker and verification facts
prohibited_actions:
  - clear focus on blocker
  - persist controller state
