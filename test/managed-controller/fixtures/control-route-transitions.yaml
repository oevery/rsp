id: control-route-transitions
sources:
  - skills/rsp/SKILL.md
  - .rsp/specs/skill-control-model.md
  - skills/rsp/references/managed-routing.md
  - skills/rsp-shape/SKILL.md
  - skills/rsp-shape/references/deep-clarification.md
  - skills/rsp-manage/SKILL.md
evidence:
  - Core exposes specialist, direct, managed, shape, and stop as peer route dispositions.
  - Shape always returns ready ownership through Core.
  - Selected Manage returns only at a true boundary.
required_contract:
  - 'Core owns `RouteDisposition`, whose values are exactly'
  - '`ControlOutcome` is response-only derived coordination data'
  - '`WorkOwner` means the selected shape-ready Change or shallow Group'
  - 'Missing or non-ready ownership uses `RouteDisposition: shape`'
  - canonical `FrontierDisposition` is exactly `out-of-goal`, `owner-decision`, `fog`, `evidence-needed`, or `executable`
  - '`StopDisposition` values are exactly:'
  - returning a ready WorkOwner to Core for fresh route derivation
  - it never resumes Manage directly
  - Return to Core only when owner identity, topology, requested route, declared behavior, acceptance, public-interface boundary, scope, mutation authority, or external-action authority changes
  - no Manage handoff or WorkerEnvelope
prohibited_actions:
  - persist ControlOutcome
  - resume Manage directly from Shape
  - treat out-of-goal as a product question
  - retain direct routing after boundary expansion
