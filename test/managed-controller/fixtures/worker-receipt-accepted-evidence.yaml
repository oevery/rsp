id: worker-receipt-accepted-evidence
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/managed-exchange.md
  - skills/rsp-manage/references/host-worker-lifecycle.md
  - .rsp/specs/skill-control-model.md
evidence:
  - A worker returns a schema-valid result whose claims still require Manager inspection.
required_contract:
  - Every WorkerInvocation expects exactly one worker-authored `WorkerReceipt`
  - '`WorkerReceipt` | worker | attributable structured claim | accepted evidence'
  - Before deriving `AcceptedLaneEvidence`
  - Schema validity and attribution do not establish acceptance
  - actual paths and local diff
prohibited_actions:
  - WorkerReceipt implies acceptance
  - provenance grants authority
  - settlement manufactures accepted evidence
