id: shape-requalification
sources:
  - skills/rsp/SKILL.md
  - skills/rsp/references/managed-routing.md
evidence:
  - Missing ownership routes directly from Core to Shape.
  - After Shape, Core rereads current evidence and freshly derives ownership, route, and qualification.
required_contract:
  - 'Missing or non-ready ownership reports `RouteDisposition: shape`'
  - Core invokes Shape only with independently granted planning-artifact authority
  - Shape returns the ready WorkRef to Core
  - re-reads status and freshly derives ownership and routing
  - configuration alone never does
  - Shape is entered only through Core when durable owner refinement is independently authorized
prohibited_actions:
  - treat returned Shape ownership as mutation authority
  - reuse stale qualification after Shape
  - let Manage invoke Shape directly
