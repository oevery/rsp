id: shape-requalification
sources:
  - skills/rsp/SKILL.md
  - skills/rsp/references/managed-routing.md
  - rules/rsp-rules.md
evidence:
  - A needs-shape return goes back to Core and planning authority remains independent.
  - After Shape, Core rereads current evidence and reruns Intake, preflight, and qualification.
required_contract:
  - Core consumes `needs-shape` by invoking Shape only with independently granted planning-artifact authority
  - then re-reads status and repeats Intake/preflight and qualification
  - Core invokes Shape only when the current request or nearer authority independently permits in-scope RSP planning artifacts
  - configuration alone never does
  - 'When selected execution returns to Core at an owner boundary or resume, re-read `rsp status --json`, apply PREFLIGHT again, then rerun QUALIFY before any later mutation or dispatch.'
  - Shape only independently authorized planning artifacts after a `needs-shape` return
prohibited_actions:
  - treat needs-shape as mutation authority
  - reuse stale qualification after Shape
  - skip Intake after topology changes
