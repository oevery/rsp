id: interruption-recovery
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/interruption-recovery.md
evidence:
  - Long-running workers and verification must survive status intervals without semantic interruption.
  - Replay and cancellation must preserve external effects and resource ownership truthfully.
required_contract:
  - Elapsed time, poll count, heartbeat count, token count, and progress-message count do not change an Assignment result or justify cancelling a healthy worker or verification command
  - Machine heartbeat is host-level liveness evidence
  - user-visible progress reports only a material checkpoint, decision, risk, or wait reason
  - Explicit cancellation waits for worker and owned background-process acknowledgement
  - resources remain claimed
  - 'resume safety: idempotent | inspect-before-repeat | non-repeatable'
  - semantic execution rollover
  - rederive a fresh ExecutionFrame
  - mark stale or unverifiable claims pending
prohibited_actions:
  - timer-driven cancellation
  - resource release before cancellation acknowledgement
  - replaying non-repeatable work by assumption
  - durable run state under .rsp
