id: owner-preflight-routing
sources:
  - skills/rsp/SKILL.md
  - skills/rsp-manage/SKILL.md
  - skills/rsp/references/managed-routing.md
evidence:
  - Core preserves specialist and tiny-work exceptions before owner preflight.
  - Core resolves a ready owner before Manage qualification.
  - Core solely owns initial qualification and selected or declined routing.
  - rsp-manage has no pre-owner Intake.
required_contract:
  - Route an explicit report-only review with fixed scope
  - Route an explicit release-documentation, finalization, publication, or reconciliation operation
  - Route one explicit isolated material domain, module/seam, or evidence-seeking design question
  - Return tiny settled work directly only when
  - Core resolves whether one unambiguous shape-ready Change or shallow Group owns the goal
  - 'Missing or non-ready ownership reports `RouteDisposition: shape`'
  - Shape returns the ready WorkRef to Core
  - Core derives one canonical ownership `ControlOutcome`
  - Manage has no pre-owner Intake
  - never creates, focuses, or reshapes a durable owner
  - solely own initial qualification and the `selected | declined` route result
  - never repeats the direct-versus-managed eligibility
  - goal, WorkRef, authority envelope, decisive qualification evidence, closeout ceiling, and return boundaries
prohibited_actions:
  - route specialist work through Manage
  - dispatch before ready ownership
  - persist an owner-preflight controller record
  - let Manage create durable ownership
  - let Manage decline a valid selected handoff to direct work
