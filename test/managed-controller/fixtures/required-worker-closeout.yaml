id: required-worker-closeout
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/closeout.md
evidence:
  - Required implementation and independent verification obligations require accepted worker receipts.
  - Acceptance owns the complete required-worker failure set; dispatch applies that rule to capability-unavailable.
  - Closeout derives not-eligible from every non-review-clean acceptance state without restating worker failures.
required_contract:
  - '`AcceptanceDisposition` independently from execution'
  - exactly `incomplete`, `evidence-complete`, or `review-clean`
  - A required worker that was not created, did not return a valid required receipt, returned `unavailable` or `boundary-changed`
  - keeps acceptance `incomplete`
  - Accepted required receipts plus fresh declared verification may derive only `evidence-complete`
  - Only a clean fixed-scope change review may then derive managed `review-clean`
  - An execution receipt never derives `review-clean` directly
  - When dispatch cannot satisfy a required worker obligation, apply the AcceptanceDisposition rule above
  - 'return `StopDisposition: capability-unavailable`, keep acceptance `incomplete`, and stop'
  - Absence of a dispatch event or receipt is never success
  - cannot be replaced by the controller claiming the worker's result
  - '`CloseoutEligibility` independently'
  - exactly `not-eligible`, `lifecycle-ready`, or `local-commit-ready`
  - 'require `completionGate: pass` plus `archiveReady: yes`'
  - 'Only that machine gate, `AcceptanceDisposition: review-clean`, fresh owner, authority, exact diff, and decisive Required verification evidence can derive a ready value'
  - 'Any other acceptance state derives `CloseoutEligibility: not-eligible`'
  - neither archive nor commit runs
  - '`manual` grants neither automatic archive nor commit'
  - '`lifecycle` grants lifecycle closeout after Manage-owned clean fixed-scope change review and a complete durable writeback decision but no Git action'
  - '`local` automatically grants lifecycle closeout'
prohibited_actions:
  - controller substitutes for unavailable required implementation worker
  - missing receipt accepted as success
  - repeated required-worker failure set in dispatch or closeout
  - archive incomplete acceptance
  - commit incomplete acceptance
