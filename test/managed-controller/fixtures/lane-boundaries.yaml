id: lane-boundaries
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/managed-exchange.md
evidence:
  - Every fresh WorkerSession receives the complete common Assignment, while only the same observed compatible session may inherit through AssignmentDelta.
  - Read-only overlap requires isolated paths and verification resources while Fix remains the sole writer.
  - Independent Verify is established only by a distinct worker identity and otherwise downgrades truthfully.
required_contract:
  - Every fresh WorkerSession receives one complete `Assignment`
  - 'Authority: <exact owner sections or paths>'
  - 'Replay safety: <idempotent | inspect-before-repeat | non-repeatable>'
  - Only an observed resumed compatible WorkerSession may receive an `AssignmentDelta`
  - immediately accepted Assignment or AssignmentDelta in that same observed WorkerSession
  - Human-facing narration follows the response language
  - retains an exact canonical result secondarily when needed
  - private Inspect remains Manager-only
  - Diagnose reuses `rsp-diagnose` and remains read-only
  - Inspect is a private Manager-only read-only lane
  - may run alongside another read-only lane only when paths and verification resources are demonstrably isolated
  - otherwise keep it sequential
  - Fix reuses `rsp-implement`, receives explicit in-scope mutation authority, and is the sole product writer at its mutation boundary
  - runs only for the Change-declared risk or after a failed correction
  - Verify delegates its read-only result and evidence contract to `rsp-verify`
  - managed receipt appends `worker identity`
  - 'independence: established | unavailable'
  - Every WorkerInvocation expects exactly one worker-authored `WorkerReceipt`
  - 'Evidence status: <valid | invalid | unavailable>'
  - 'Release claim: <released | retained | unavailable>'
  - Use localized labeled natural language as the default Assignment and WorkerReceipt presentation
  - Do not emit both natural-language and JSON renderings by default
  - Before deriving `AcceptedLaneEvidence`
  - Independent Verify is established only when its worker identity and the accepted Fix worker identity are both available and different
  - 'record `independence: unavailable`; ordinary read-only Verify may still run, but Manager must not claim independent verification'
prohibited_actions:
  - concurrent writes at one mutation boundary
  - Verify performed by Fix
  - fabricated independent verification
  - public Inspect Skill
  - delta inheritance across WorkerSessions
