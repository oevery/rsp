id: host-settlement-release
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/host-worker-lifecycle.md
  - .rsp/specs/skill-control-model.md
evidence:
  - One WorkerInvocation has terminal output while host cleanup and conflicting resource ownership remain unresolved.
required_contract:
  - Observe creation, delivery, admission, activity or wait, interruption request, cancellation acknowledgement, settlement, and release as distinct facts
  - Settlement closes liveness, not acceptance
  - release closes conflicting runtime resource ownership, not product acceptance
  - A completed WorkerSession without a compatible longitudinal successor is released through the host when supported
prohibited_actions:
  - settlement implies release
  - release implies acceptance
  - provider-specific status as canonical RSP vocabulary
