id: drift-safe-resume
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/interruption-recovery.md
evidence:
  - A paused managed run is resumed after the worktree or evidence may have changed.
required_contract:
  - reread the current authority, status, focused owner, worktree diff, blockers, and decisive evidence
  - revalidate the selected handoff before mutation or worker dispatch
  - Treat continuation prose only as pointers
prohibited_actions:
  - trust stale continuation
  - mutate before selected-handoff validation
