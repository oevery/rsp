id: runtime-resume-hydration
sources:
  - skills/rsp/SKILL.md
  - skills/rsp-manage/references/interruption-recovery.md
evidence:
  - A paused managed goal resumes with a bounded runtime context packet or without runtime.
required_contract:
  - confirm they have stopped before acknowledging the pause
  - Context save and hydration accept no caller clock
  - compare the packet source sequence with the current committed run revision
  - revalidate checkout, WorkRef, Git, dirty-path, authority, schema, expiry, and complete source identities
  - reread current authority pointers and the source keys selected for hydration
  - Runtime absence, failure, corruption, disposal, or stale context yields diagnostics or history only
  - Validate the selected handoff again
  - Current authority always wins.
  - stale context yields diagnostics or history only
prohibited_actions:
  - resume from cached authority
  - skip changed-source reread
  - persist paused controller state
