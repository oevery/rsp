id: assignment-post-admission-cancellation
sources:
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/host-worker-lifecycle.md
  - skills/rsp-manage/references/interruption-recovery.md
  - .rsp/specs/skill-control-model.md
evidence:
  - Assignment admission transfers cancellation ownership from the caller to the managed runtime contract.
required_contract:
  - After admission, cancelling the caller's wait does not retract accepted work
  - Use the host's explicit interrupt or cancellation operation when available
  - Retain affected ResourceLeases until cancellation is acknowledged or settlement is observed
  - cancelling the caller's own wait does not retract accepted work
  - no conflicting Assignment starts
prohibited_actions:
  - caller cancellation retracts admitted work
  - release lease on caller timeout
  - implicit post-admission cancellation
