id: managed-critical-path-solo
sources:
  - skills/rsp/SKILL.md
  - skills/rsp/references/managed-routing.md
  - skills/rsp/references/control-outcome.md
  - skills/rsp-manage/SKILL.md
  - .rsp/specs/skill-control-model.md
evidence:
  - A goal qualifies for Manage through lifecycle or acceptance coordination while its immediate implementation path remains coupled.
  - No independent identity, isolated resource, or declared acceptance obligation requires a worker.
required_contract:
  - Selection transfers current-phase control from Core to Manage; it does not imply worker delegation
  - '`DispatchDisposition: none | preferred | required`'
  - Manage qualification, distinct execution/acceptance phases, and separate owners never manufacture a worker obligation
  - '`none` invokes the local Discipline without synthetic delegation'
  - selected Manage execution through a bounded local Discipline
prohibited_actions:
  - mandatory implementation worker for every managed run
  - synthetic delegation
  - controller self-certifies required independent verification
