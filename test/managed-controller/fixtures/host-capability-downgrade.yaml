id: host-capability-downgrade
sources:
  - .rsp/specs/skill-control-model.md
  - skills/rsp-manage/SKILL.md
  - skills/rsp-manage/references/interruption-recovery.md
evidence:
  - Host capability absence is independent from execution location and must never be inferred from worker identity.
  - Missing resume, cancellation, identity, or heartbeat APIs produce truthful stop or downgrade behavior without fabricated acknowledgement.
  - The isolated contract profile exercises the negative capability boundary without invoking a provider or creating a production runtime adapter.
required_contract:
  - Do not require hosts to expose worker identity, cancellation, heartbeat, or process APIs they do not have
  - unavailable capabilities fail or downgrade truthfully instead of being inferred
  - A failed creation or resume creates no synthetic dispatch, continuity, or inherited boundary claim
  - Explicit cancellation waits for worker and owned background-process acknowledgement
  - until acknowledgement, resources remain claimed and no conflicting Assignment starts
  - 'record `independence: unavailable`; ordinary read-only Verify may still run, but Manager must not claim independent verification'
  - Elapsed time, poll count, heartbeat count, progress-message count, token count, token limit, and token cost are not authority, safety, acceptance, completion, or closeout inputs
  - Token or context cost may break a tie only between otherwise equally safe and authorized strategies
  - a worker identity never proves filesystem or runtime isolation
prohibited_actions:
  - execution location treated as host capability removal
  - synthetic resume acknowledgement
  - synthetic cancellation acknowledgement
  - early ResourceLease release
  - fabricated independent verification
  - timer-driven worker failure
