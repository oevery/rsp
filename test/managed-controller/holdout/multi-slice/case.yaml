id: multi-slice
expected_mode: execute
request: >-
  Finish the focused ready Change completely without waiting for step-by-step confirmation.
  Its header and retry slices have separate owners, files, and focused tests. You may modify only
  src/header.mjs, test/header.test.mjs, src/retry.mjs, test/retry.test.mjs, and
  .rsp/changes/normalize-transport-inputs.md. Run npm test, preserve unrelated files, and stop only
  at a real authority or evidence boundary. Do not stage, commit, archive, publish, or perform external actions.
allowed_changes:
  - .rsp/changes/normalize-transport-inputs.md
  - src/header.mjs
  - src/retry.mjs
  - test/header.test.mjs
  - test/retry.test.mjs
verification:
  - npm
  - test
expected_output:
  - npm test
  - header
  - retry
forbidden_output:
  - committed the changes
  - archived the Change
