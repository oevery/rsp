id: runtime-observability-absent
base_case: auto-multisurface-routing
automatic_activation: true
expected_mode: execute
installed_skills:
  - rsp
  - rsp-manage
  - rsp-implement
runtime_observability:
  state: absent
  diagnostic: manage_runtime_broker_absent
request: >-
  Complete the focused tracked Change `refresh-status-guidance` under automatic managed routing.
  The shared terminology surfaces require one sequential implementation writer. The optional runtime
  capability is absent with the diagnostic below. Continue with the unchanged no-runtime path:
  absence is diagnostic only and must not alter routing, authority, worker obligations, acceptance,
  closeout, or continuation. Modify only the allowed paths, run npm test, and update the Change
  truthfully. Do not archive, stage, commit, push, publish, start a Broker, create `.rsp` run state,
  or manufacture observations. In the final response report `selected`, `sequential`, `npm test`,
  the exact diagnostic, and that no-runtime behavior was preserved.
allowed_changes:
  - .rsp/changes/refresh-status-guidance.md
  - .rsp/specs/status-presentation.md
  - src/status-card.mjs
  - docs/en/status.md
  - docs/zh-CN/status.md
  - test/status-card.test.mjs
  - test/docs-sync.test.mjs
required_changes:
  - .rsp/changes/refresh-status-guidance.md
  - .rsp/specs/status-presentation.md
  - src/status-card.mjs
  - docs/en/status.md
  - docs/zh-CN/status.md
verification:
  - npm
  - test
expected_output:
  - selected
  - sequential
  - npm test
  - manage_runtime_broker_absent
  - no-runtime
forbidden_output:
  - Broker started
  - route changed for runtime
  - controller state created
