id: managed-ambiguous-no-owner
stage: shaping
evidence:
  - the user explicitly requests managed completion
  - no sufficient ready owner exists
  - repository inspection cannot settle a material acceptance choice
expected:
  next_action: route to Shape for the single highest-impact owner decision
  returned_owner: the user decision required by Shape
sources:
  - skills/rsp/SKILL.md
  - skills/rsp/references/managed-routing.md
  - skills/rsp-manage/SKILL.md
required_contract:
  - Every return is one transient `ControlOutcome`
  - behavior, acceptance, interface, scope, mutation authority, external action, or human choice remains materially unresolved
  - one highest-impact owner question
  - resume through fresh Intake only after the owner answers
  - It does not focus another owner, mutate a planning or product artifact, create a controller record, or dispatch a worker
prohibited_actions: [implement, dispatch, commit, push, publish]
