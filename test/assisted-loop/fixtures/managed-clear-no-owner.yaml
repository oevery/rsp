id: managed-clear-no-owner
stage: shaping
evidence:
  - the user explicitly requests managed completion
  - the non-trivial outcome, scope, authority, and acceptance are clear
  - no sufficient ready owner exists
expected:
  next_action: create the smallest sufficient owner through Shape and re-evaluate Manage
  returned_owner: the newly ready Change or shallow Group
sources:
  - skills/rsp/SKILL.md
  - skills/rsp/references/managed-routing.md
required_contract:
  - Invoke `rsp-manage` Intake and consume its canonical `ControlOutcome`
  - Canonical ready ownership identifies one unambiguous selected shape-ready Change or shallow Group
  - Core invokes Shape only when that outcome returns ownership to Shape and the current request or nearer authority independently permits in-scope RSP planning artifacts
  - repeats Intake selection and qualification without another authorization round
prohibited_actions: [commit, push, publish]
