id: tdd-route
evidence:
  - no unexplained failure remains
  - the selected Change explicitly requires test-first evidence for a public protocol change
  - rsp-tdd is available in the loaded skill inventory
expected:
  next_action: select rsp-tdd once
  returned_owner: the same selected Change
sources:
  - skills/rsp/SKILL.md
  - skills/rsp-implement/SKILL.md
required_contract:
  - rsp-tdd
  - explicitly required by the user, selected Change, or project instructions
  - concrete changed risk
  - same selected Change
prohibited_actions: [production-before-red, recursive-skill-invocation, review, commit, push, publish]
