minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
shellEmulator: true

packages:
  - .

overrides:
  # Panda CSS pins an older patch with source-map file disclosure advisories.
  postcss@<=8.5.22: 8.5.31
  # Keep VitePress 1.x on the tested, patched Vite 6 development server.
  vitepress@1.6.4>vite: 6.4.5

allowBuilds:
  # Tailwind's one-shot compiler uses prebuilt binaries, not the optional watcher build.
  '@parcel/watcher': false
  esbuild: false
  workerd: true
