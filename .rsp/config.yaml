# RSP project configuration
# An empty kinds list retains the built-in defaults.
# A non-empty kinds list replaces the built-in defaults; it does not extend them.
# Every entry must be a unique non-empty string.
#
# Built-in defaults:
#   kinds:               feature, fix, refactor, docs, ops, research
#
kinds: []

# Decision Records default to .rsp/specs/decisions.
decisions:
  path: .rsp/specs/decisions

# Automatic delegation is off; explicit worker requests remain allowed.
# Closeout applies only to established final delivery: ask, auto, or manual.
# Ordinary completion and checkpoint commits keep work open. No setting grants Git authority.
workflow:
  delegation: off
  closeout: ask

# Set one shared project default for durable artifact and commit prose.
# Response language remains user/session-owned and is never read from this project mapping.
language:
  default: en
  # artifacts: zh-CN
  # commit: zh-CN
