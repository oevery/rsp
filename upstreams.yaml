version: 1

sources:
  agent-skills-spec:
    repository: https://github.com/agentskills/agentskills.git
    ref: main
    tier: core
    strategy: conform
    paths:
      - README.md
      - LICENSE*
      - skills-ref/**
      - docs/**/*.md
      - docs/**/*.mdx

  antfu-skills:
    repository: https://github.com/antfu/skills.git
    ref: main
    tier: core
    strategy: tooling
    paths:
      - README.md
      - LICENSE*
      - meta.ts
      - instructions/**
      - skills/**/*.md
      - scripts/**

  matt-skills:
    repository: https://github.com/mattpocock/skills.git
    ref: main
    tier: core
    strategy: adapt
    paths:
      - README.md
      - LICENSE*
      - AGENTS.md
      - CONTEXT.md
      - package.json
      - .agents/**
      - .claude-plugin/**
      - .changeset/**
      - .out-of-scope/**
      - docs/engineering/**
      - docs/productivity/**
      - scripts/**
      - skills/engineering/**
      - skills/productivity/**

  openspec:
    repository: https://github.com/Fission-AI/OpenSpec.git
    ref: main
    tier: core
    strategy: model
    paths:
      - README.md
      - LICENSE*
      - src/**
      - docs/**/*.md
      - schemas/**
      - openspec/**

  ponytail:
    repository: https://github.com/DietrichGebert/ponytail.git
    ref: main
    tier: core
    strategy: adapt
    paths:
      - README.md
      - LICENSE*
      - skills/**
      - benchmarks/**
      - hooks/**

  spec-kit:
    repository: https://github.com/github/spec-kit.git
    ref: main
    tier: core
    strategy: model
    paths:
      - README.md
      - LICENSE*
      - src/**
      - templates/**
      - extensions/**
      - docs/**/*.md
      - .specify/**
      - presets/**
      - workflows/**

  compound-engineering:
    repository: https://github.com/EveryInc/compound-engineering-plugin.git
    ref: main
    tier: reference
    strategy: adapt
    paths:
      - README.md
      - LICENSE*
      - skills/**
      - docs/skills/**
      - docs/solutions/skill-design/**
      - tests/**

  gsd-core:
    repository: https://github.com/open-gsd/gsd-core.git
    ref: main
    tier: reference
    strategy: model
    paths:
      - README.md
      - LICENSE*
      - src/**
      - agents/**
      - commands/**
      - docs/**/*.md

  openai-plugins:
    repository: https://github.com/openai/plugins.git
    ref: main
    tier: reference
    strategy: tooling
    paths:
      - README.md
      - .agents/plugins/**
      - plugins/**/*.md
      - plugins/**/*.json
      - plugins/**/*.yaml

  planning-with-files:
    repository: https://github.com/OthmanAdi/planning-with-files.git
    ref: master
    tier: reference
    strategy: model
    paths:
      - README.md
      - LICENSE
      - .agents/skills/planning-with-files/**
      - docs/workflow.md
      - docs/evals.md
      - docs/codex.md
      - docs/attestation-locking.md
      - templates/**
      - scripts/**
      - tests/**

  andrej-karpathy-skills:
    repository: https://github.com/multica-ai/andrej-karpathy-skills.git
    ref: main
    tier: reference
    strategy: model
    paths:
      - README.md
      - CLAUDE.md
      - EXAMPLES.md
      - skills/karpathy-guidelines/SKILL.md
      - .claude-plugin/**
      - .cursor/rules/**

  skills-cli:
    repository: https://github.com/vercel-labs/skills.git
    ref: main
    tier: reference
    strategy: tooling
    paths:
      - README.md
      - package.json
      - src/**

  superpowers:
    repository: https://github.com/obra/superpowers.git
    ref: main
    tier: reference
    strategy: adapt
    paths:
      - README.md
      - LICENSE*
      - skills/**
      - tests/**

  addy-agent-skills:
    repository: https://github.com/addyosmani/agent-skills.git
    ref: main
    tier: reference
    strategy: adapt
    paths:
      - README.md
      - LICENSE*
      - AGENTS.md
      - skills/**
      - evals/**
      - scripts/**

  anthropic-skill-creator:
    repository: https://github.com/anthropics/skills.git
    ref: main
    tier: reference
    strategy: adapt
    paths:
      - README.md
      - THIRD_PARTY_NOTICES.md
      - skills/skill-creator/**

  deepseek-harness:
    repository: https://github.com/deepseek-ai/deepseek-harness.git
    ref: master
    tier: reference
    strategy: model
    paths:
      - README.md
      - README.zh.md
      - LICENSE
      - AGENTS.md
      - .agents/**
      - scripts/**

  everything-claude-code:
    repository: https://github.com/affaan-m/everything-claude-code.git
    ref: main
    tier: reference
    strategy: model
    paths:
      - README.md
      - LICENSE*
      - skills/**

  skillopt:
    repository: https://github.com/microsoft/SkillOpt.git
    ref: main
    tier: reference
    strategy: model
    paths:
      - README.md
      - LICENSE
      - docs/**
      - plugins/**
      - skillopt/**
      - skillopt_sleep/**
      - tests/**

  skillspector:
    repository: https://github.com/NVIDIA/SkillSpector.git
    ref: main
    tier: reference
    strategy: tooling
    paths:
      - README.md
      - LICENSE
      - SECURITY.md
      - docs/**
      - skills/**
      - src/**
      - tests/**

  skill-use-bench:
    repository: https://github.com/JinyiHan99/Skill-Use-Bench.git
    ref: main
    tier: reference
    strategy: model
    paths:
      - README.md
      - benchmark/**
      - evaluation/**
