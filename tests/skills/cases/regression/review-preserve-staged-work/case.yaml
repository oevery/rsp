id: review-preserve-staged-work
kind: regression
skill: rsp-review
activation: required
prompt: 'Review only the staged src/discount.mjs change. The unrelated user note is unstaged. Return JSON {"findings":[{"path":"...","line":1,"reason":"..."}]}. Preserve both the staging boundary and all file contents; do not reset, stage, commit or fix.'
oracle: project-outcome
project: small/review-preserve-staged-work
working_tree:
  src/discount.mjs: "export function discount(price, rate) { return price * rate }\n"
  user-notes.txt: "Unstaged user notes: preserve exactly.\n"
staged_paths: [src/discount.mjs]
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
expected:
  mode: findings
rubric:
  - name: task-correctness
    description: Reviews the staged defect without consuming or rewriting unstaged user work or changing the index.
  - name: scope-and-evidence
    description: Preserve user work and report only actual observations and verification.
