id: skill-author-critique
kind: behavior
skill: rsp-review
activation: required
project: small/skill-authoring
prompt: 'Review the export-guide Skill against export-contract.md. Our writing contract requires concise action/result instructions, necessary order in numbered steps, and peer conditions in bullets; ornamental repetition is not acceptable. Explain the smallest useful corrections to meaning and expression. This is read-only: do not edit files, execute exports or create a plan artifact.'
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
rubric:
  - name: bounded-critique
    description: Reviews the fixed Skill instructions through Code for behavior and Document for explanation, keeping export-contract.md authority-only. Identifies overbroad selection and artificial stopping, deduplicates shared defects, and returns findings without repair authority or independent-self-review claims. Judge actual responsibilities and outcomes, not reference-reading fingerprints; no Doc writing workflow is needed.
  - name: agreed-expression
    description: Treats the stated concise-expression requirements as contracts, identifies vague/repetitive instructions with concrete evidence, and preserves real input/permission conditions. Separates alternative tasks from necessary sequence and expresses peer conditions as peers. Does not invent word limits, required headings or personal style findings.
