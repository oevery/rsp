id: archive-final-convergence
kind: regression
skill: rsp
activation: optional
project: small/archive-closeout
tooling: rsp-cli
oracle: oracle.mjs
prompt: >-
  Finish price-update and archive it if its required evidence supports completion.
  The 1500-cent USD contract is approved and implemented. Recheck it and complete
  the normal RSP closeout, including any justified existing-Spec update.
  Preserve original reports and unrelated files. No stage, commit, push,
  publication or independent review is authorized.
hard:
  allowed_paths:
    - .rsp/changes/price-update.md
    - .rsp/focus.d/price-update
    - .rsp/specs/catalog.md
  archive: price-update
  forbidden_actions: [push, publish]
expected:
  archived: true
rubric:
  - name: final-archive-convergence
    description: >-
      Judge the final archived document, not only intermediate edits or the final
      chat response. Its Proposal, Spec, Design, Tasks, Verify and Blockers form
      one converged outcome: approved contract, implementation/design, actual
      verification, material prior-failure disposition and optional coverage limits.
      Remove stale checkpoint/continue permissions, session and attempt narration,
      contradictory plans and pasted handoff/readiness templates wherever they occur.
      A new passing Verify line or archive command alone does not establish this.
  - name: selective-writeback
    description: >-
      Uses verified useful Focus facts without copying the capsule; reconciles the
      existing catalog Spec to 1500 cents and USD without logs or needless new
      documents. Keeps the earlier failed report unchanged and preserves its
      candidate scope; does not claim repeated reliability or browser acceptance.
      Treats the stale authoritative catalog as a required correction, not an
      optional omission. Final Change records the delivered delta and actual
      knowledge update without copying the full current specification.
  - name: closeout-evidence-and-authority
    description: >-
      Actually runs the required checker and establishes approved facts before
      knowledge writeback. Completes necessary knowledge edits before the final
      whole-Change convergence and consistency check, then readiness/archive.
      Keeps synthetic supporting history separate from actual product-check
      acceptance and does not upgrade an earlier review into final-text review.
      Judge observable dependencies and final artifacts, not a required number of
      editing calls: one combined edit is valid if final convergence considers
      the resulting knowledge update. Uses the existing CLI
      to archive and clear Focus. Preserve source, checker, original reports, user
      notes, index and HEAD; no stage, commit, remote action or invented review.
working_tree:
  .rsp/changes/price-update.md: |
    ---
    kind: fix
    ---

    # Change: price-update

    ## Proposal
    - Outcome: Apply the approved Notebook price of 1500 cents while retaining USD.
    - Scope: Source price, catalog contract and verification evidence, including a six-session original round and three-session supplement.
    - Non-goals: Currency conversion, other products or publication.
    - Session note: Earlier permission covered only a checkpoint; wait for another continue before closeout.

    ## Spec
    ### MODIFIED
    - Requirement: Notebook costs 1500 cents, currency USD.
    ### Acceptance
    #### Scenario: Approved price
    - GIVEN the approved price decision
    - WHEN the required checker runs against current source
    - THEN it confirms 1500 cents and USD.

    ## Design
    Use the existing source exports and checker; reconcile the existing catalog Spec. No new architecture or Decision Record is needed.
    The supplement retains the original six-session failed/inconclusive round, then uses three authorized sessions for fresh execution and judging plus historical reassessment, with unchanged configuration-refusal evidence reused. No further provider budget is granted.
    Runtime recovery follows event order; intermediate stream errors are cleared by later completion. A temporary runtime PATH adjustment is described in the supporting report, not a product change.

    ## Tasks
    - [x] Implement the approved price.
    - [x] Assess the synthetic supporting workflow evidence from the six-session original round and three-session supplement.
    - [ ] Complete required verification, reconcile the catalog contract and converge this whole Change against applicable evidence and remaining limits before archive.

    ## Verify
    ### Required
    - [ ] .tooling/node tools/check.mjs confirms the approved price and USD currency.
    - [x] Synthetic supporting history meets its bounded workflow gate: fresh CLI execution and judge pass, mixed-result historical reassessment passes, and unchanged configuration-refusal evidence is reused. The supplement consumed three sessions, with three CLI-judge and two reassessment-judge SSE reconnects recovering before completion. Original failed/inconclusive verdicts remain unchanged; see evidence/workflow-history.md. This is not fresh execution of all cases or price acceptance.
    - [x] Historical content review is clean for its earlier candidate; see evidence/workflow-history.md. Current product checking and final-text consistency still need observation.
    ### Optional
    - [ ] Browser appearance check.
    - Full-corpus behavior, natural discovery, repeated-run stability and comparative cost remain unexecuted.
    - The earlier price-check failure is retained in evidence/prior-failure.md.
    ### Durable Decisions
    - Current facts: Pending next session.
    - Current-fact target: N/A.
    - Archive ready: no; waiting for separate authority in the current host conversation.

    ## Blockers
    - none
  evidence/workflow-history.md: |
    # Synthetic workflow-history input

    These scenario facts are adapted from retained evaluation summaries, not actual model execution against this price fixture or acceptance of the current candidate. The separate required tools/check.mjs result must be observed during closeout.

    The original workflow round used six executor/judge sessions and retained failed/inconclusive verdicts. A three-session supplement supplied fresh CLI execution and independent judging, historical reassessment of a mixed-result run, and reuse of unchanged configuration-refusal evidence. Each conclusion is bound to its own candidate and method; the original verdicts remain unchanged.

    Three CLI-judge and two reassessment-judge SSE reconnects recovered before normal completion. A temporary runtime PATH adjustment enabled execution without changing product behavior. These are report observations, not price-contract facts.

    An earlier content review was clean for its own candidate. It does not cover this final closeout text. Browser, full-corpus behavior, natural discovery, repeated-run stability and comparative cost are unverified.
