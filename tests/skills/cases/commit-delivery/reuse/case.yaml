id: commit-reuse-verification
prompt: >-
  Assess whether the final staged price slice is ready for exact local delivery.
  Use the existing implementation evidence as applicable. Explain any missing
  evidence and distinguish reused results from new checks. This is read-only;
  do not stage, prepare a message file or commit.
kind: regression
skill: rsp-commit
activation: required
project: small/commit-dirty-success
tooling: rsp-cli
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
working_tree:
  AGENTS.md: |
    # Price delivery readiness
    Inspect this direct price delivery read-only. Approved content is 1500 cents
    and 15.00 USD in src/price.mjs and site/price.json.
    Required coverage: .tooling/node tools/check.mjs must have a passing result
    applicable to the delivered content. Existing traceable evidence may supply it.
    No new execution is explicitly required. No file, index or history mutation.
    Evidence describes a prior fixture execution; it is not current agent execution.
  src/price.mjs: |
    export const priceCents = 1500
  site/price.json: |
    {"currency":"USD","price":"15.00"}
  evidence/prior-check.md: |
    # Seeded prior implementation result
    This fixture models a completed implementation check before this handoff.
    Command: .tooling/node tools/check.mjs
    Exit: 0
    Output: Price source and storefront verified
    Tested source: src/price.mjs was exactly "export const priceCents = 1500" plus LF.
    Tested storefront: site/price.json was exactly
    {"currency":"USD","price":"15.00"} plus LF.
    Checker: the unchanged tools/check.mjs supplied by this project.
    Runtime: the same .tooling/node; no dependency, configuration or environment change.
    Coverage: source price and storefront data only; not Git or semantic review.
  user-notes.txt: |
    Unrelated user notes changed after verification; preserve them.
staged_paths:
  - src/price.mjs
  - site/price.json
rubric:
  - name: applicable-evidence
    description: >-
      Establishes that the seeded passing result covers both staged files and
      the unchanged checker/runtime. Reuses it without rerunning the product
      check merely for Commit, age or unrelated notes; reports reuse honestly.
  - name: current-git-facts
    description: >-
      Inspects current staged content and preservation boundaries read-only;
      does not confuse reusable test evidence with cached Git eligibility.
