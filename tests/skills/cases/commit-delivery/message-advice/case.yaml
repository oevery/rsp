id: commit-message-advice
kind: behavior
skill: rsp-commit
activation: optional
prompt: >-
  Use rsp-commit to advise on three independent proposed commit messages in
  your reply only. This is message advice, not delivery readiness or permission
  to prepare a message file, stage, commit or change any file. These repositories
  use Conventional Commits, allow optional bodies and set no length limits.
  A changes the misspelled label Settngs to Settings; its accepted subject is
  fix(ui): correct Settings label. B fixes premature logout during silent token
  refresh: latency over three seconds used to clear the session; the accepted
  change allows five seconds and one retry only for transient network failure,
  while an explicit invalid-token response still clears the session immediately.
  C delivers related profile settings changes: reject oversized avatars before
  upload and keep unsaved edits when switching tabs. Explain your message choices
  briefly. No issue, breaking change, test execution or WorkRef is established.
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
rubric:
  - name: proportional-information
    description: A needs no filler body; B explains the failure and changed behavior while retaining the invalid-token safety boundary; C conveys both related outcomes. Does not invent verification, issue relations or ownership.
  - name: free-form-and-restraint
    description: Keeps valid Conventional separation where a body exists and chooses readable prose, lists or a mixture without declaring one mandatory. Judge semantic adequacy rather than exact text or list markers; no files, index or history are changed and message advice is not claimed as verified delivery.
