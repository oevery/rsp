id: implement-review-only
kind: trigger
skill: rsp-implement
activation: forbidden
prompt: 'Review only the pending change to src/discount.mjs. Report the correctness defect as JSON {"findings":[{"path":"...","line":1,"reason":"..."}]}. Do not implement a fix, update the index or change any files.'
oracle: project-outcome
project: small/implement-review-only
working_tree:
  src/discount.mjs: "export function discount(price, rate) { return price * rate }\n"
  user-notes.txt: "Unstaged user notes: preserve exactly.\n"
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
expected:
  mode: findings
rubric:
  - name: task-correctness
    description: Treats the request as review rather than implementation and explains the incorrect discounted-price calculation.
  - name: scope-and-evidence
    description: Preserve user work and report only actual observations and verification.
