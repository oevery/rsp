id: trigger-rsp-review
kind: trigger
skill: rsp-review
prompt: Review the current repository diff and return only a fixed-scope report. Do not change files.
oracle: oracle.mjs
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
rubric:
  - name: review-routing
    description: The review skill is used to produce a scoped, evidence-backed report without implementation or invented findings.
expected:
  workspace_unchanged: true
