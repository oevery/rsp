id: trigger-rsp-diagnose
kind: trigger
skill: rsp-implement
prompt: 'Use rsp-implement to investigate the claim "the CLI sometimes loses focus". No reproduction, logs or project files have been supplied. Give a bounded evidence-gathering next step. Do not implement a speculative fix or write any files.'
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
rubric:
  - name: task-and-routing
    description: Separates the reported symptom from an established cause and requests discriminating evidence without pretending to reproduce it.
  - name: authority-and-evidence
    description: No mutation, unrequested dispatch, Git delivery, fabricated evidence or unsupported completion claim.
