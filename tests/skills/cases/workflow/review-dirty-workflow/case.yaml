id: review-dirty-workflow
kind: workflow
skill: rsp-review
activation: required
prompt: 'Review the pending src/discount.mjs diff against HEAD. Return JSON {"findings":[{"path":"...","line":1,"reason":"..."}]} with the concrete calculation defect. Keep the working tree and index exactly as found; do not fix or stage anything.'
oracle: project-outcome
project: small/review-dirty-workflow
working_tree:
  src/discount.mjs: "export function discount(price, rate) { return price * rate }\n"
  user-notes.txt: "Unstaged user notes: preserve exactly.\n"
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
expected:
  mode: findings
rubric:
  - name: task-correctness
    description: 'Finds the real arithmetic regression in the provided diff, cites its location, and preserves unrelated dirty work.'
  - name: scope-and-evidence
    description: Preserve user work and report only actual observations and verification.
