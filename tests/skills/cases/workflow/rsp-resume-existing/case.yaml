id: rsp-resume-existing
kind: workflow
skill: rsp
activation: required
prompt: 'Resume the focused Change after an interruption. Inspect the project to determine its current state and next action; do not change files or make unresolved user decisions. Return JSON with workRef, state (partial, blocked or complete), next (verify, ask-owner or review), and an explanation grounded in the inspected evidence.'
oracle: project-outcome
project: small/rsp-resume-existing
tooling: rsp-cli
project_check: requested-export
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
expected:
  mode: partial
rubric:
  - name: task-correctness
    description: Recognizes that implementation already exists but verification remains unfinished; keeps the same WorkOwner and does not claim completion.
  - name: scope-and-evidence
    description: Preserve user work and report only actual observations and verification.
