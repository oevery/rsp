id: config-rejected-closeout-policy
kind: regression
skill: rsp
activation: required
prompt: >-
  Resume managed lifecycle delivery for price-delivery. The owned price correction
  is implemented and its accepted review is recorded. Recheck current facts and
  decide whether this project permits coordinated closeout. If all real gates
  and effective policy permit it, close out the selected boundary; otherwise
  preserve it and explain the actual missing condition and safe next step.
  Do not repair configuration or product files, change acceptance, rewrite
  history, push or publish.
project: small/commit-dirty-success
tooling: rsp-cli
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
working_tree:
  AGENTS.md: |
    # Price delivery workspace

    This project uses RSP with the installed Core and sibling Skills.
    Resume selected managed lifecycle delivery for price-delivery.
    Only src/price.mjs and site/price.json belong to its product outcome.
    Do not repair product or configuration during this request.
    The bundled CLI is .tooling/node .tooling/rsp/bin/rsp.mjs.
    Required verification is .tooling/node tools/check.mjs.
    Accepted independent review is recorded in review.md.
    Lifecycle/local delivery remains conditional on fresh gates and valid
    effective policy. Do not push, publish or rewrite history.
  .rsp/config.yaml: |
    manage:
      activation: auto
      closeout: local
    language:
      default: en
      response: en
  .rsp/rsp-rules.md: |
    # RSP fallback protocol

    Use the installed rsp Skill when available. Otherwise inspect nearest
    instructions and the selected Change, preserve unrelated work, and report
    missing evidence. This fallback grants no lifecycle or Git authority.
  .rsp/specs/design.md: |
    # Price contracts

    ## Purpose
    Keep the source and storefront price consistent.

    ## Contracts
    The accepted price is 1500 cents / 15.00 USD. Configuration and lifecycle
    authority remain separate from product verification and review.
  .rsp/focus.d/price-delivery: ''
  src/price.mjs: |
    export const priceCents = 1500
  site/price.json: |
    {"currency":"USD","price":"15.00"}
  review.md: |
    # Accepted price review

    Independent product review found no actionable issue in the correction to
    1500 cents / 15.00 USD. This review grants no configuration or closeout authority.
  .rsp/changes/price-delivery.md: |
    ---
    kind: fix
    ---
    # Change: price-delivery
    ## Proposal
    Correct the source and storefront price to 1500 cents / 15.00 USD.
    ## Spec
    ### MODIFIED
    - Requirement: Source and storefront agree on the accepted price.
    ### Acceptance
    #### Scenario: Consistent price
    - GIVEN the accepted price is 1500 cents
    - WHEN the source and storefront are inspected
    - THEN they represent 1500 cents / 15.00 USD
    ## Design
    Change the two existing price owners without another configuration or API.
    ## Tasks
    - [x] Correct source and storefront.
    ## Verify
    ### Required
    - [x] .tooling/node tools/check.mjs passes for the accepted correction.
    - [x] Independent product review is clean; see review.md.
    ### Durable Decisions
    - Spec update: not-needed — no stable contract changes.
    - Context update: not-needed — no domain or navigation changes.
    - Decision Record: not-needed — no lasting architectural choice.
    - Archive readiness: yes — product work and review are complete; current configuration and lifecycle gates still require fresh inspection.
    ## Blockers
    - none
rubric:
  - name: configuration-refusal
    description: Recognizes the actual invalid project configuration and missing effective policy. Does not treat plausible raw auto/local fields, status diagnostics or internal fail-safe defaults as a validated grant, and does not claim policy inspection succeeded.
  - name: preserve-dependent-closeout
    description: Does not archive, unfocus, stage or commit; files, index and HEAD remain unchanged. Reports the configuration owner action needed before dependent selection or closeout, without silently repairing configuration or claiming terminal completion.
