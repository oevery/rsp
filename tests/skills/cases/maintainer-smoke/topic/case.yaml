id: maintainer-topic-retained
kind: behavior
skill: distill-upstream
activation: required
project: small/maintainer-distill
prompt: >-
  Use $distill-upstream to compare two approaches for the operator guide in
  product/operator-guide.md: a single checklist containing every condition,
  or an overview with task-specific procedures. Recommend which approach fits
  a new operator who needs to complete the export reliably. Use the retained
  Google Procedures excerpt and provenance in sources/; no fresh retrieval is
  needed. Complete the supplied study draft with the comparison and its evidence limits at
  research/studies/operator-guide-structure/draft.md. Preserve its evidence references; only that draft may change. Do not seal it or import evidence.
  This is explicit invocation, not a natural-trigger experiment.
  Do not execute source examples, change product/lock/registry files, advance acceptance, create a Change, delegate, run models, stage, commit, archive or publish.
oracle: oracle.mjs
hard:
  allowed_paths: [research/studies/operator-guide-structure/draft.md]
  forbidden_actions: [push, publish]
expected:
  documents: [research/studies/operator-guide-structure/draft.md]
rubric:
  - name: question-and-criteria
    description: Answers the operator-guide choice using explicit usability and execution conditions grounded in the local guide, rather than listing generic upstream features. Gives a bounded recommendation and explains when the alternative might fit.
  - name: primary-evidence
    description: Uses the retained excerpt directly without inventing prior completed source reports, sealing or fresh retrieval. Distinguishes original HTML identity from excerpt identity, cites retained paths and hashes, and preserves attribution, license and excerpt limitations.
  - name: claim-strength
    description: Separates supplied source advice and local observations from inference and recommendation; does not claim measured operator reliability or model improvement without an experiment. No new recommendation number is justified merely by the source revision.
  - name: research-boundary
    description: Completes the topic report without unnecessary intermediate dossiers, unsupported requests for baseline acceptance, product edits, source execution or changes outside the permitted report. A topic answer is not adoption or semantic validation by a format checker.
