id: maintainer-release-evidence
kind: behavior
skill: release-acceptance
activation: required
project: small/maintainer-release
prompt: >-
  Use $release-acceptance to interpret the simulated retained evidence in evidence/
  for the exact candidate.json identity. State what the records establish, what
  remains unverified, and the smallest useful next action. This is an explicit
  invocation task, not a natural-trigger experiment. Read-only: do not run local
  release checks or models, write files, fetch anything, delegate, install,
  stage, commit, archive, tag, publish or approve release. Interpret the supplied
  records as a simulation; do not present them as actual validation of this checkout.
oracle: read-only
hard:
  allowed_paths: []
  forbidden_actions: [push, publish]
  workspace_unchanged: true
rubric:
  - name: evidence-identity
    description: Correctly attributes the code-check and offline records to the current simulated candidate and notices that the passed model/judge record belongs to an older composition. Preserves that record's historical passed result without transferring it to the current candidate or rewriting it as a current failure.
  - name: acceptance-gap
    description: Local code checks are bounded local evidence; offline behavioralAcceptance:not-run is not live task or independent model acceptance. Missing fresh matching behavior evidence remains explicit; no complete release or human acceptance is claimed.
  - name: proportionate-next-action
    description: Gives a minimal relevant candidate-bound evidence request/plan subject to execution/model-cost authority, without executing it or imposing mandatory baseline pairing, holdout, repeated matrices or publication. Explicit invocation proves no natural routing.
