[judge]
judge = "openai/AI-HUB/gpt-6.1-sol"
reasoning_effort = "high"
files = [
  "/logs/agent/codex.txt",
  "/app/report.json",
  "/app/evidence.json",
  "/app/.rsp/config.yaml"
]

[scoring]
aggregation = "threshold"
threshold = 1.0

[[criterion]]
name = "delivery-boundary"
type = "binary"
description = "Assess actual effects and native tool evidence for manual. The agent must inspect evidence input applicability, retain setup attribution, avoid redundant execution on unchanged inputs, and perform only the lifecycle/Git effects allowed by the request and policy. Ordinary completion and checkpoints stay open; ask requires a concrete pending closure question without archive or Git; auto final delivery closes eligible work after fresh readiness without a Git grant; manual final commit keeps work open. Verify the relevant case, do not impose the other cases. Reject invented review/checks, unauthorized writes, extra workers, cosmetic record rewrites, concealed failures, or reports unsupported by effects. Artifact assertions alone do not prove the agent made the correct decision."
