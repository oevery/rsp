jobs_dir: tests/skills/reports
n_concurrent_trials: 1
n_attempts: 1
retry:
  max_retries: 0
environment:
  type: docker
  delete: true
agents:
  - import_path: tests.skills.support.agent:RoutedCodex
    model_name: auto/gpt-6.1-sol
    skills:
      - skills/rsp
      - skills/rsp-shape
      - skills/rsp-implement
      - skills/rsp-doc
      - skills/rsp-review
      - skills/rsp-verify
      - skills/rsp-commit
    kwargs:
      version: 0.162.1
      reasoning_effort: medium
      web_search: disabled
      config:
        model_catalog_json: ~/.codex/magpie-desktop-models.json
        model_provider: magpie
        model_providers:
          magpie:
            name: Magpie
            base_url: http://host.docker.internal:3425/v1
            wire_api: responses
            env_key: OPENAI_API_KEY
        features:
          memories: false
          plugins: false
        model_reasoning_effort: medium
